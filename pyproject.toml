[project]
name = "oscar"
version = "0.1.0"
description = "A proactive email agent that decides how much autonomy to take."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["oscar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
