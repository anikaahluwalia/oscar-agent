# The hosted demo's API on Render (New -> Blueprint). Only the demo runs: no Gmail, no keys.
# After the web app is on Vercel, set OSCAR_WEB_ORIGINS to its address in Render's dashboard.
services:
  - type: web
    name: oscar-demo-api
    runtime: python
    plan: free
    buildCommand: pip install -e .
    # One worker: each visitor's demo is kept in this process's memory.
    startCommand: uvicorn oscar.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /gmail
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OSCAR_DEMO_ONLY
        value: "1"
      - key: OSCAR_AUTO_CHECK_MINUTES
        value: "0"
      - key: OSCAR_WEB_ORIGINS
        sync: false
