# The hosted demo on Render (New -> Blueprint): the API and the web app. Only the demo runs: no Gmail, no keys.
# After the first deploy, paste each service's address into the other (README, Deploy the demo).
services:
  - type: web
    name: oscar-demo-api
    runtime: python
    plan: free
    buildCommand: pip install -e .
    # One worker: each visitor's demo is kept in this process's memory.
    startCommand: uvicorn oscar.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /gmail
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OSCAR_DEMO_ONLY
        value: "1"
      - key: OSCAR_AUTO_CHECK_MINUTES
        value: "0"
      - key: OSCAR_WEB_ORIGINS  # the web app's address
        sync: false

  - type: web
    name: oscar-demo
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_OSCAR_API  # the API's address, built into the web app
        sync: false
